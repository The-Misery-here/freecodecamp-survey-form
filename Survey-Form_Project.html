
<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Survey Form</title>
  </head>

  <body>

    <!-- Header -->
    <header>
      <h1 id="title">freeCodeCamp Survey Form</h1>

      <p id="description">
        Thank you for taking the time to help us improve the platform.
      </p>
    </header>

    <main>

      <!-- Survey Form -->
      <form
        id="survey-form"
        method="POST"
        action="https://hotel-feedback.freecodecamp.org"
      >

        <!-- Personal Information -->
        <fieldset>
          <legend>Personal Information</legend>

          <label id="name-label" for="name">Name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
            required
          />

          <label id="email-label" for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
          />

          <label id="number-label" for="number">
            Age (optional)
          </label>
          <input
            type="number"
            id="number"
            name="age"
            min="10"
            max="99"
            placeholder="Age"
          />

          <label for="dropdown">
            Which option best describes your current role?
          </label>

          <select name="role" id="dropdown">
            <option value="" disabled selected>
              Select current role
            </option>
            <option value="student">Student</option>
            <option value="full-time-job">Full Time Job</option>
            <option value="full-time-learner">Full Time Learner</option>
            <option value="prefer-not-to-say">Prefer Not to Say</option>
            <option value="other">Other</option>
          </select>

        </fieldset>

        <!-- Recommendation -->
        <fieldset>
          <legend>
            Would you recommend freeCodeCamp to a friend?
          </legend>

          <input
            type="radio"
            id="definitely"
            name="recommend"
            value="definitely"
            checked
          />
          <label for="definitely">Definitely</label>

          <input
            type="radio"
            id="maybe"
            name="recommend"
            value="maybe"
          />
          <label for="maybe">Maybe</label>

          <input
            type="radio"
            id="not-sure"
            name="recommend"
            value="not-sure"
          />
          <label for="not-sure">Not sure</label>

        </fieldset>

        <!-- Favorite Feature -->
        <fieldset>
          <legend>
            What is your favorite feature of freeCodeCamp?
          </legend>

          <select name="feature" id="feature">
            <option value="" disabled selected>
              Select an option
            </option>
            <option value="challenges">Challenges</option>
            <option value="projects">Projects</option>
            <option value="community">Community</option>
            <option value="open-source">Open Source</option>
          </select>

        </fieldset>

        <!-- Improvements -->
        <fieldset>
          <legend>
            What would you like to see improved?
            (Check all that apply)
          </legend>

          <input
            type="checkbox"
            id="front-end-projects"
            name="improvements"
            value="front-end-projects"
          />
          <label for="front-end-projects">Front-end Projects</label>

          <input
            type="checkbox"
            id="back-end-projects"
            name="improvements"
            value="back-end-projects"
          />
          <label for="back-end-projects">Back-end Projects</label>

          <input
            type="checkbox"
            id="data-visualization"
            name="improvements"
            value="data-visualization"
          />
          <label for="data-visualization">Data Visualization</label>

          <input
            type="checkbox"
            id="challenges"
            name="improvements"
            value="challenges"
          />
          <label for="challenges">Challenges</label>

          <input
            type="checkbox"
            id="open-source"
            name="improvements"
            value="open-source"
          />
          <label for="open-source">Open Source Community</label>

          <input
            type="checkbox"
            id="courses"
            name="improvements"
            value="courses"
          />
          <label for="courses">Additional Courses</label>

          <input
            type="checkbox"
            id="gitter-help-rooms"
            name="improvements"
            value="gitter-help-rooms"
          />
          <label for="gitter-help-rooms">Gitter Help Rooms</label>

          <input
            type="checkbox"
            id="videos"
            name="improvements"
            value="videos"
          />
          <label for="videos">Videos</label>

          <input
            type="checkbox"
            id="city-meetups"
            name="improvements"
            value="city-meetups"
          />
          <label for="city-meetups">City Meetups</label>

          <input
            type="checkbox"
            id="wiki"
            name="improvements"
            value="wiki"
          />
          <label for="wiki">Wiki</label>

          <input
            type="checkbox"
            id="forum"
            name="improvements"
            value="forum"
          />
          <label for="forum">Forum</label>

        </fieldset>

        <!-- Additional Comments -->
        <fieldset>
          <legend>Additional Comments</legend>

          <label for="comments">
            Any comments or suggestions?
          </label>

          <textarea
            id="comments"
            name="comments"
            rows="4"
            cols="40"
            placeholder="Enter your comments here..."
          ></textarea>

        </fieldset>

        <!-- Submit Button -->
        <button type="submit" id="submit">
          Submit
        </button>

      </form>

    </main>

  </body>
</html>
